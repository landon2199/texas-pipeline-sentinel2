name: Refresh dashboard data

on:
  push:
    branches: [main]
    paths: ['team.json', 'scripts/**']
  issues:
    types: [opened, edited, labeled, closed, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build data/status.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-status.mjs
      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json
          # The timestamp always changes, so compare everything except that line.
          if git diff --cached --quiet -I '"generated"'; then
            echo "No change."
            git reset --quiet
          else
            git commit --quiet -m "Refresh status data"
            # Another refresh may have pushed first; replay this commit on top of it.
            git pull --rebase --quiet -X theirs origin main || git rebase --abort
            git push --quiet || echo "Push skipped; the next refresh will catch up."
          fi
